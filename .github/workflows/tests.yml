name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: myworld/requirements-min.txt

      - name: Install dependencies
        run: pip install -r myworld/requirements-min.txt

      - name: Django checks and tests
        working-directory: myworld
        env:
          SECRET_KEY: ci-only-secret-key
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test

      - name: Data pipeline tests
        run: python -m unittest discover -s python

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Committed bundles are up to date
        run: |
          npm run build
          npm run vendor
          git diff --exit-code -- myworld/line/static

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: myworld/requirements-min.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: pip install -r myworld/requirements-min.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run e2e
